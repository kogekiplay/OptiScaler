name: OptiScaler Chinese Nightly

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    # 04:23 in Asia/Shanghai. The non-round minute avoids peak scheduler congestion.
    - cron: "23 20 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build unsigned x64 package
    runs-on: windows-latest
    outputs:
      filename: ${{ steps.meta.outputs.filename }}
      version: ${{ steps.meta.outputs.version }}

    steps:
      - name: Check out source and submodules
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v3

      - name: Read version metadata
        id: meta
        shell: pwsh
        run: |
          $resource = Get-Content .\OptiScaler\resource.h -Raw

          function Get-VersionPart([string] $name) {
            if ($resource -match "#define\s+$name\s+(\d+)") {
              return $Matches[1]
            }
            throw "Missing version component: $name"
          }

          $version = "v$(Get-VersionPart 'VER_MAJOR_VERSION').$(Get-VersionPart 'VER_MINOR_VERSION').$(Get-VersionPart 'VER_HOTFIX_VERSION')-pre$(Get-VersionPart 'VER_BUILD_NUMBER')"
          $shortSha = $env:GITHUB_SHA.Substring(0, 7)
          $date = (Get-Date).ToUniversalTime().ToString('yyyyMMdd')
          $filename = "OptiScaler_zh-CN_${version}_${date}_${shortSha}"

          "version=$version" >> $env:GITHUB_OUTPUT
          "filename=$filename" >> $env:GITHUB_OUTPUT

      - name: Build Release x64
        shell: pwsh
        run: msbuild .\OptiScaler.sln /m /t:Build /p:Configuration=Release /p:Platform=x64 /verbosity:minimal

      - name: Validate and compress package
        shell: pwsh
        run: |
          $packageRoot = "$env:GITHUB_WORKSPACE\x64\Release\a"
          $dll = "$packageRoot\OptiScaler.dll"
          if (!(Test-Path -LiteralPath $dll)) {
            throw "Build succeeded without the expected package DLL: $dll"
          }

          $archive = "$env:GITHUB_WORKSPACE\${{ steps.meta.outputs.filename }}.7z"
          & 7z a -t7z $archive "$packageRoot\*"
          if ($LASTEXITCODE -ne 0) {
            throw "7z failed with exit code $LASTEXITCODE"
          }

          & 7z t $archive
          if ($LASTEXITCODE -ne 0) {
            throw "7z validation failed with exit code $LASTEXITCODE"
          }

          $hash = Get-FileHash -LiteralPath $archive -Algorithm SHA256
          "$($hash.Hash.ToLowerInvariant())  $(Split-Path $archive -Leaf)" |
            Set-Content -LiteralPath "$archive.sha256" -Encoding ascii

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.meta.outputs.filename }}
          path: |
            ${{ steps.meta.outputs.filename }}.7z
            ${{ steps.meta.outputs.filename }}.7z.sha256
          compression-level: 0
          retention-days: 14
          if-no-files-found: error

  release:
    name: Update rolling Chinese nightly release
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: optiscaler-zh-nightly-release
      cancel-in-progress: true

    steps:
      - name: Check out history and tags
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download built package
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.filename }}
          path: dist

      - name: Generate release notes
        shell: bash
        env:
          TAG: nightly-zh-cn
        run: |
          set -euo pipefail

          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            changes="$(git log --no-merges --pretty='- `%h` %s (%an)' "$TAG..HEAD")"
          else
            changes="$(git log -20 --no-merges --pretty='- `%h` %s (%an)')"
          fi

          {
            echo '自动构建的 OptiScaler 简体中文未签名 Nightly。'
            echo
            echo "- Version: \`${{ needs.build.outputs.version }}\`"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Workflow: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            echo '### 本次变更'
            if [[ -n "$changes" ]]; then
              printf '%s\n' "$changes"
            else
              echo '- 无代码变更（定时重建）'
            fi
          } > nightly-notes.md

      - name: Move rolling nightly tag to this build
        uses: actions/github-script@v9
        env:
          TAG: nightly-zh-cn
        with:
          script: |
            const tag = process.env.TAG;
            try {
              await github.rest.git.getRef({ ...context.repo, ref: `tags/${tag}` });
              await github.rest.git.updateRef({
                ...context.repo,
                ref: `tags/${tag}`,
                sha: context.sha,
                force: true,
              });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.git.createRef({
                ...context.repo,
                ref: `refs/tags/${tag}`,
                sha: context.sha,
              });
            }

      - name: Publish rolling prerelease
        uses: softprops/action-gh-release@v3
        with:
          tag_name: nightly-zh-cn
          name: OptiScaler 简体中文 Nightly（未签名）
          body_path: nightly-notes.md
          prerelease: true
          make_latest: false
          overwrite_files: true
          fail_on_unmatched_files: true
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Remove assets from older nightly builds
        uses: actions/github-script@v9
        env:
          TAG: nightly-zh-cn
          KEEP: |
            ${{ needs.build.outputs.filename }}.7z
            ${{ needs.build.outputs.filename }}.7z.sha256
        with:
          script: |
            const keep = new Set(process.env.KEEP.split(/\r?\n/).filter(Boolean));
            const release = await github.rest.repos.getReleaseByTag({
              ...context.repo,
              tag: process.env.TAG,
            });
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, {
              ...context.repo,
              release_id: release.data.id,
              per_page: 100,
            });

            for (const asset of assets) {
              if (!keep.has(asset.name)) {
                await github.rest.repos.deleteReleaseAsset({
                  ...context.repo,
                  asset_id: asset.id,
                });
              }
            }
